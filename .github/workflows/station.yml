name: Station Olympus — press run

# The worker is never deployed. A runner checks this repo out, produces one
# morning's show in about two minutes, and is destroyed. "Deploying" the
# worker is `git push`.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Morning to produce (YYYY-MM-DD). Blank means today."
        required: false
        type: string
      no_audio:
        description: "Write the show but skip synthesis (saves TTS quota)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Produce but publish nothing"
        required: false
        type: boolean
        default: false

  # 05:30 UTC is 11:00 in Asia/Kolkata. Late enough that the watch has finished
  # uploading the night and the whole of the day before, so the show is written
  # from settled numbers rather than a half-synced night. GitHub's scheduler
  # drifts by several minutes under load; nothing here depends on the minute.
  schedule:
    - cron: "30 5 * * *"

concurrency:
  # Two press runs for the same morning would fight over the same episode row.
  group: station-press-run
  cancel-in-progress: false

jobs:
  press-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install the worker
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Check the secrets arrived
        env:
          STATION_API_URL: ${{ secrets.STATION_API_URL }}
          STATION_SECRET: ${{ secrets.STATION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          # Presence only — values are never printed.
          ok=1
          for name in STATION_API_URL STATION_SECRET GEMINI_API_KEY FISH_AUDIO_API_KEY DIRECT_DATABASE_URL; do
            if [ -n "${!name}" ]; then
              echo "✓ $name is set (${#name} chars name, $(eval "echo \${#$name}") chars value)"
            else
              echo "✗ $name is MISSING — repo Settings → Secrets and variables → Actions → Repository secrets"
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Check the gate still holds
        working-directory: worker
        run: python -m pytest

      - name: Press run
        working-directory: worker
        env:
          STATION_API_URL: ${{ secrets.STATION_API_URL }}
          STATION_SECRET: ${{ secrets.STATION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          STATION_TZ: ${{ vars.STATION_TZ || 'Asia/Kolkata' }}
          STATION_TTS_MODEL: ${{ vars.STATION_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
        run: |
          python -m station.run \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.no_audio && '--no-audio' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
